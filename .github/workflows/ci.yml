name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out extension
        uses: actions/checkout@v7
        with:
          path: testwitness-extension

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testwitness-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: testwitness-extension
        run: npm ci

      - name: Validate extension
        working-directory: testwitness-extension
        run: npm run validate
